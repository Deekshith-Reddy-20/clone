services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karyuk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karyuk}
      POSTGRES_DB: ${POSTGRES_DB:-karyuk}
    ports:
      - "5432:5432"
    volumes:
      - karyuk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karyuk}"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/realm-karyuk.json:/opt/keycloak/data/import/realm-karyuk.json:ro
    ports:
      - "8080:8080"
    profiles:
      - keycloak

  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-karyuk}:${POSTGRES_PASSWORD:-karyuk}@db:5432/${POSTGRES_DB:-karyuk}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app

volumes:
  karyuk_pgdata: